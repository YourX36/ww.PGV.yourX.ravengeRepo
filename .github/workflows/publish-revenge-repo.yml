name: Publish Revenge repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check types
        run: bun run lint:types

      - name: Build Auto Translate
        run: bun run build auto-translate

      - name: Package plugin
        run: |
          mkdir -p public package
          cp plugins/auto-translate/manifest.json package/manifest.json
          cp plugins/auto-translate/build/js/index.js package/index.js
          (cd package && zip -q ../public/com.gleb.autotranslate.zip manifest.json index.js)

      - name: Generate repository index
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          bun --bun node_modules/@revenge-mod/plugin-cli/bin/revenge-plugin.js \
            generate-index --dist public --base-url "$base_url" --out public/index.json
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
